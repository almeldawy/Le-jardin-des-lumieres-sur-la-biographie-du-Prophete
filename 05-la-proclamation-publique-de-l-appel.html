وَمَا هُوَ بِبَٰلِغِهِۦۚ وَمَا دُعَآءُ ٱلۡكَٰفِرِينَ إِلَّا فِي ضَلَٰلٖ﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Et ceux qu'ils invoquent en dehors de Lui ne leur répondent en rien, si ce n'est comme celui qui tend les deux mains vers l'eau pour qu'elle parvienne à sa bouche, alors qu'elle n'y parviendra pas. Et l'invocation des mécréants n'est qu'égarement. »<\/p><\/blockquote><figcaption>[Ar-Raʿd, 13:14]<\/figcaption><\/figure><p>Ensuite, les associateurs furent invités à réfléchir un peu. Puisqu'ils reconnaissaient qu'Allah, le Très-Haut, est le Créateur de toute chose, et que leurs divinités n'ont rien créé<\/p><p>et ne peuvent rien créer, mais sont elles-mêmes des créatures d'Allah, on leur dit : comment avez-vous donc mis sur un pied d'égalité Allah, le Créateur, le Puissant, et ces créatures impuissantes ? Comment les avez-vous égalés dans l'adoration et l'invocation, puisque vous adorez Allah et vous adorez ceux-là, vous invoquez Allah et vous invoquez ceux-là ?<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿أَفَمَن يَخۡلُقُ كَمَن لَّا يَخۡلُقُۚ أَفَلَا تَذَكَّرُونَ﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Celui qui crée est-il comme celui qui ne crée pas ? Ne vous souvenez-vous donc pas ? »<\/p><\/blockquote><figcaption>[An-Nahl, 16:17]<\/figcaption><\/figure><p>Lorsque cette question leur fut adressée, ils restèrent interdits ; leur argument leur échappa ; ils se turent et regrettèrent. Puis ils s'accrochèrent à une chose vaine. Ils dirent : nos pères étaient parmi les hommes les plus raisonnables, connus pour cela parmi les gens ; le proche et le lointain reconnaissaient l'excellence de leur intelligence, et ils étaient tous sur cette religion. Comment cette religion pourrait-elle être un égarement et une fausseté ? D'autant que les pères du Prophète ﷺ et les pères des musulmans étaient eux aussi sur cette religion.<\/p><p>Il leur fut répondu qu'ils n'étaient pas bien guidés, qu'ils n'avaient pas connu le chemin de la vérité et ne l'avaient pas suivi. Il s'ensuit qu'ils étaient égarés, ne comprenant rien et n'étant pas guidés. Cela leur fut dit tantôt par allusion et par sous-entendu, tantôt en toute franchise, comme dans la parole du Très-Haut :<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿إِنَّهُمۡ أَلۡفَوۡاْ ءَابَآءَهُمۡ ضَآلِّينَ ۝٦٩ فَهُمۡ عَلَىٰٓ ءَاثَٰرِهِمۡ يُهۡرَعُونَ ۝٧٠﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Ils ont trouvé leurs pères égarés, et les voilà qui courent sur leurs traces. »<\/p><\/blockquote><figcaption>[As-Sâffât, 37:69-70]<\/figcaption><\/figure><p>Voilà pour un aspect. D'un autre côté, les associateurs se mirent à effrayer<\/p><p>le Prophète ﷺ et les musulmans au moyen de leurs divinités. Ils disaient : vous avez manqué de respect à nos divinités en exposant leur impuissance ; elles vont se mettre en colère contre vous, vous faire périr ou vous frapper de folie à cause de cela. C'était comme ce que les anciens disaient à leurs messagers :<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿إِن نَّقُولُ إِلَّا ٱعۡتَرَىٰكَ بَعۡضُ ءَالِهَتِنَا بِسُوٓءٖۗ﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Nous disons seulement que l'une de nos divinités t'a frappé d'un mal. »<\/p><\/blockquote><figcaption>[Hûd, 11:54]<\/figcaption><\/figure><p>Il y fut répondu en rappelant aux associateurs, et en leur opposant, ce qu'ils constataient nuit et jour : ces divinités ne peuvent ni bouger de leur place, ni avancer ou reculer d'un pas, ni repousser un mal d'elles-mêmes. Comment pourraient-elles donc nuire aux musulmans et les faire périr ?<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿أَلَهُمۡ أَرۡجُلٞ يَمۡشُونَ بِهَآۖ أَمۡ لَهُمۡ أَيۡدٖ يَبۡطِشُونَ بِهَآۖ أَمۡ لَهُمۡ أَعۡيُنٞ يُبۡصِرُونَ بِهَآۖ أَمۡ لَهُمۡ ءَاذَانٞ يَسۡمَعُونَ بِهَاۗ قُلِ ٱدۡعُواْ شُرَكَآءَكُمۡ ثُمَّ كِيدُونِ فَلَا تُنظِرُونِ﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Ont-ils des pieds pour marcher ? Ont-ils des mains pour saisir ? Ont-ils des yeux pour voir ? Ont-ils des oreilles pour entendre ? Dis : \"Invoquez vos associés, puis rusez contre moi, et ne m'accordez aucun répit.\" »<\/p><\/blockquote><figcaption>[Al-Aʿrâf, 7:195]<\/figcaption><\/figure><p>À cette occasion, Il leur proposa quelques paraboles explicites, comme la parole du Très-Haut :<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿يَـٰٓأَيُّهَا ٱلنَّاسُ ضُرِبَ مَثَلٞ فَٱسۡتَمِعُواْ لَهُۥٓۚ إِنَّ ٱلَّذِينَ تَدۡعُونَ مِن دُونِ ٱللَّهِ لَن يَخۡلُقُواْ ذُبَابٗا وَلَوِ ٱجۡتَمَعُواْ لَهُۥۖ وَإِن يَسۡلُبۡهُمُ ٱلذُّبَابُ شَيۡـٔٗا لَّا يَسۡتَنقِذُوهُ مِنۡهُۚ ضَعُفَ ٱلطَّالِبُ وَٱلۡمَطۡلُوبُ﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Ô gens ! Une parabole vous est proposée, écoutez-la : ceux que vous invoquez en dehors d'Allah ne sauraient même pas créer une mouche, quand bien même ils s'uniraient pour cela. Et si la mouche leur dérobait quelque chose, ils ne pourraient le lui reprendre. Faible est le solliciteur, et faible le sollicité ! »<\/p><\/blockquote><figcaption>[Al-Hajj, 22:73]<\/figcaption><\/figure><p>Et comme la parole du Très-Haut :<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿مَثَلُ ٱلَّذِينَ ٱتَّخَذُواْ مِن دُونِ ٱللَّهِ أَوۡلِيَآءَ كَمَثَلِ ٱلۡعَنكَبُوتِ ٱتَّخَذَتۡ بَيۡتٗاۖ وَإِنَّ أَوۡهَنَ ٱلۡبُيُوتِ لَبَيۡتُ ٱلۡعَنكَبُوتِۚ لَوۡ كَانُواْ يَعۡلَمُونَ﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Ceux qui ont pris des protecteurs en dehors d'Allah ressemblent à l'araignée qui s'est donné une maison. Or la maison la plus fragile est bien la maison de l'araignée, s'ils savaient ! »<\/p><\/blockquote><figcaption>[Al-ʿAnkabût, 29:41]<\/figcaption><\/figure><p>Un musulman a exposé leur impuissance par ce vers :<\/p><figure class=\"cite arabic\"><div class=\"lab\">Texte arabe<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">أرب يبول الثعلبان برأسه <br> لقد ذل من بالت عليه الثعالب<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>Un seigneur, celui sur la tête duquel urine le renard ? Il est bien vil, celui sur qui urinent les renards !<\/p><\/blockquote><\/figure><p>Lorsqu'on en arriva à cette franchise, les associateurs s'agitèrent et s'emportèrent ; ils insultèrent les musulmans, au point d'insulter leur Seigneur, Allah – Gloire à Lui, le Très-Haut. Quant aux musulmans, Allah – Gloire à Lui, le Très-Haut – leur interdit de revenir à ce qui provoquait cela ; Il dit :<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿وَلَا تَسُبُّواْ ٱلَّذِينَ يَدۡعُونَ مِن دُونِ ٱللَّهِ فَيَسُبُّواْ ٱللَّهَ عَدۡوَۢا بِغَيۡرِ عِلۡمٖۗ﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« N'insultez pas ceux qu'ils invoquent en dehors d'Allah, car ils insulteraient Allah par hostilité, sans savoir. »<\/p><\/blockquote><figcaption>[Al-Anʿâm, 6:108]<\/figcaption><\/figure><p>Quant aux associateurs, ils décidèrent de faire échouer l'appel et d'obstruer le chemin d'Allah par la pression, la force et la violence. Chaque grand personnage et chaque chef se mit à torturer ceux de sa tribu qui avaient cru, et un groupe d'entre eux alla trouver Abû Tâlib pour qu'il empêche lui-même le Messager d'Allah ﷺ d'appeler à Allah.<\/p><h3 id=\"s5-h38\">La torture des musulmans<\/h3><p>Pour torturer les musulmans, ils employèrent des procédés qui font frissonner la peau et fendent les cœurs.<\/p><p>Bilâl ibn Rabâh – qu'Allah l'agrée – était l'esclave d'Umayya ibn Khalaf<\/p><p>al-Jumahî. Umayya lui passait une corde au cou et le livrait aux enfants, qui jouaient avec lui, tandis qu'il disait : « Un, Un ! » (Ahad, Ahad). Il le sortait à l'heure de midi, l'étendait sur le dos dans la ramdâ' – le sable ou les pierres brûlants –, puis ordonnait qu'on place un énorme rocher sur sa poitrine. Puis il disait : « Tu resteras ainsi jusqu'à ce que tu meures, ou que tu renies Muhammad et adores al-Lât et al-ʿUzzâ. » Et lui disait : « Un, Un ! »<\/p><p>Abû Bakr – qu'Allah l'agrée – passa près de lui un jour alors qu'il était torturé ; il l'acheta et l'affranchit pour Allah.<\/p><p>ʿÂmir ibn Fuhayra était torturé jusqu'à perdre connaissance et ne plus savoir ce qu'il disait.<\/p><p>Abû Fukayha, dont le nom était Aflah, fut torturé ; on dit qu'il était des Azd. Il était l'affranchi des Banû ʿAbd ad-Dâr. Ils le sortaient au milieu du jour, dans une chaleur intense, les pieds entravés de fers ; ils le dépouillaient de ses vêtements, l'étendaient face contre terre dans la ramdâ', puis posaient un rocher sur son dos pour qu'il ne puisse pas bouger. Il restait ainsi jusqu'à perdre la raison. On ne cessa de le torturer de la sorte jusqu'à ce qu'il émigre en Abyssinie lors de la seconde émigration. Une fois, ils lui lièrent les pieds avec une corde, le traînèrent, le jetèrent dans la ramdâ' et l'étranglèrent au point de croire qu'il était mort. Abû Bakr passa près de lui ; il l'acheta et l'affranchit pour Allah.<\/p><p>Khabbâb ibn al-Aratt faisait partie de ceux qui avaient été capturés à l'époque préislamique. Il fut acheté<\/p><p>par Umm Anmâr, fille de Sibâʿ al-Khuzâʿiyya. Il était forgeron. Lorsqu'il embrassa l'Islam, sa maîtresse le tortura par le feu : elle apportait le fer rougi et le posait sur son dos pour qu'il renie Muhammad ﷺ, mais cela ne faisait qu'accroître sa foi et sa soumission. Les associateurs le torturaient aussi : ils lui tordaient le cou et lui tiraient les cheveux. Ils le jetèrent à plusieurs reprises sur des braises, puis posèrent sur sa poitrine une lourde pierre pour qu'il ne puisse pas se relever.<\/p><p>Zinnîra était une esclave byzantine qui embrassa l'Islam. Elle fut torturée pour Allah et atteinte à la vue au point de devenir aveugle. On lui dit : « Ce sont al-Lât et al-ʿUzzâ qui t'ont frappée. » Elle répondit : « Non, par Allah, ce ne sont pas elles qui m'ont frappée. Ceci vient d'Allah, et s'Il le veut, Il l'enlèvera. » Le lendemain matin, Allah lui avait rendu la vue. Quraych dit : « C'est là une partie de la sorcellerie de Muhammad. »<\/p><p>Umm ʿUbays, une esclave des Banû Zuhra, embrassa l'Islam. Son maître al-Aswad ibn ʿAbd Yaghûth, qui était l'un des pires ennemis du Messager d'Allah ﷺ et de ceux qui se moquaient de lui, la torturait.<\/p><p>L'esclave de ʿAmr ibn Mu'ammal, des Banû ʿAdî, embrassa l'Islam. ʿUmar ibn al-Khattâb, qui était alors associateur, la torturait : il la frappait jusqu'à s'épuiser, puis la laissait en disant : « Par Allah, je ne te laisse que par lassitude. » Elle répondait : « C'est ainsi que ton Seigneur te traitera. »<\/p><p>Parmi les esclaves qui embrassèrent l'Islam et furent torturées, mentionnons an-Nahdiyya et sa fille, qui appartenaient à une femme des Banû ʿAbd ad-Dâr.<\/p><p>Abû Bakr – qu'Allah l'agrée – acheta ces esclaves et les affranchit, comme il avait affranchi Bilâl, ʿÂmir ibn Fuhayra et Abû Fukayha. Son père Abû Quhâfa le lui reprocha et dit : « Je te vois affranchir des esclaves faibles ; si tu affranchissais des hommes robustes, ils te protégeraient. » Il répondit : « Je ne recherche que la Face d'Allah. » Allah, le Très-Haut, révéla alors un passage du Coran dans lequel Il fait son éloge et blâme ses ennemis. Il dit :<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿فَأَنذَرۡتُكُمۡ نَارٗا تَلَظَّىٰ ۝١٤ لَا يَصۡلَىٰهَآ إِلَّا ٱلۡأَشۡقَى ۝١٥ ٱلَّذِي كَذَّبَ وَتَوَلَّىٰ ۝١٦﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Je vous ai donc avertis d'un Feu qui flambe, où ne brûlera que le plus misérable, celui qui dément et se détourne. »<\/p><\/blockquote><figcaption>[Al-Layl, 92:14-16]<\/figcaption><\/figure><p>C'est Umayya ibn Khalaf et ceux qui lui ressemblaient.<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿وَسَيُجَنَّبُهَا ٱلۡأَتۡقَى ۝١٧ ٱلَّذِي يُؤۡتِي مَالَهُۥ يَتَزَكَّىٰ ۝١٨ وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعۡمَةٖ تُجۡزَىٰٓ ۝١٩ إِلَّا ٱبۡتِغَآءَ وَجۡهِ رَبِّهِ ٱلۡأَعۡلَىٰ ۝٢٠ وَلَسَوۡفَ يَرۡضَىٰ ۝٢١﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Et en sera écarté le plus pieux, celui qui donne ses biens pour se purifier, et auprès de qui nul ne bénéficie d'un bienfait qu'il devrait récompenser, mais [qui agit] seulement pour rechercher la Face de son Seigneur, le Très-Haut. Et certes, il sera satisfait. »<\/p><\/blockquote><figcaption>[Al-Layl, 92:17-21]<\/figcaption><\/figure><p>C'est Abû Bakr as-Siddîq – qu'Allah, le Très-Haut, l'agrée, ainsi que ceux qu'il a affranchis et l'ensemble des Compagnons.<\/p><p>ʿAmmâr ibn Yâsir, sa mère et son père – qu'Allah les agrée – furent torturés. Ils étaient les alliés des Banû Makhzûm. Les Banû Makhzûm – Abû Jahl à leur tête – les sortaient vers al-Abtah lorsque la ramdâ' était brûlante, et les torturaient par sa chaleur. Le Messager d'Allah ﷺ passait près d'eux et disait :<\/p><figure class=\"cite hadith\"><div class=\"lab\">Texte arabe (hadith)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">صبرا آل ياسر، موعدكم الجنة، اللهم اغفر لآل ياسر<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Patience, famille de Yâsir ! Votre rendez-vous est le Paradis. Ô Allah, pardonne à la famille de Yâsir ! »<\/p><\/blockquote><\/figure><p>Quant à Yâsir, le père de ʿAmmâr – Yâsir ibn ʿÂmir ibn Mâlik al-ʿAnsî al-Madhhijî –, il mourut sous la torture. Quant à la mère de ʿAmmâr – Sumayya, fille de Khayyât, affranchie d'Abû Hudhayfa al-Makhzûmî, qui était une vieille femme âgée et faible –, Abû Jahl la transperça d'une lance dans les parties intimes, et elle mourut. Elle fut la première martyre de l'Islam.<\/p><p>Quant à ʿAmmâr, la torture devint trop lourde pour lui. Les associateurs tantôt le revêtaient d'une cotte de mailles de fer par une journée d'été, tantôt plaçaient sur sa poitrine un lourd rocher rouge, tantôt le plongeaient dans l'eau, jusqu'à ce qu'il dise de sa langue certaines choses qui leur convenaient, alors que son cœur était rempli de foi. Allah révéla alors :<\/p><figure class=\"cite quran\"><div class=\"lab\">Texte arabe (verset coranique)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">﴿مَن كَفَرَ بِٱللَّهِ مِنۢ بَعۡدِ إِيمَٰنِهِۦٓ إِلَّا مَنۡ أُكۡرِهَ وَقَلۡبُهُۥ مُطۡمَئِنُّۢ بِٱلۡإِيمَٰنِ وَلَٰكِن مَّن شَرَحَ بِٱلۡكُفۡرِ صَدۡرٗا فَعَلَيۡهِمۡ غَضَبٞ مِّنَ ٱللَّهِ وَلَهُمۡ عَذَابٌ عَظِيمٞ﴾<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Quiconque a renié Allah après avoir cru – excepté celui qui y a été contraint alors que son cœur demeure serein dans la foi –, mais ceux qui ouvrent délibérément leur poitrine à la mécréance, sur eux est une colère d'Allah, et ils auront un châtiment immense. »<\/p><\/blockquote><figcaption>[An-Nahl, 16:106]<\/figcaption><\/figure><p>Musʿab ibn ʿUmayr fut torturé pour Allah. Il était parmi les gens qui menaient la vie la plus aisée. Lorsqu'il entra dans l'Islam, sa mère le priva de nourriture et de boisson et le chassa de la maison, si bien que sa peau se mit à desquamer comme la mue d'un serpent.<\/p><p>Suhayb ibn Sinân le Byzantin fut torturé jusqu'à perdre connaissance et ne plus savoir ce qu'il disait.<\/p><p>ʿUthmân ibn ʿAffân fut torturé : son oncle l'enroulait dans une natte de feuilles de palmier, puis l'enfumait par-dessous.<\/p><p>Abû Bakr as-Siddîq et Talha ibn ʿUbayd Allâh subirent des sévices. Nawfal ibn Khuwaylid al-ʿAdawî – on a dit : ʿUthmân ibn ʿUbayd Allâh, frère de Talha ibn ʿUbayd Allâh – les saisit et les attacha ensemble à une même corde pour les empêcher de prier et de pratiquer leur religion. Ils ne lui obéirent pas, et il ne fut surpris que de les voir libérés et en train de prier. On les surnomma « les deux liés » (al-qarînân), parce qu'ils avaient été attachés à une même corde.<\/p><p>Lorsqu'Abû Jahl apprenait qu'un homme de rang et de puissance avait embrassé l'Islam, il le blâmait, l'humiliait et le menaçait de lui infliger une lourde perte dans ses biens et son prestige. Et si l'homme était faible, il le frappait et excitait les autres contre lui. En somme, ils n'apprenaient pas que quelqu'un était entré dans l'Islam sans s'en prendre à lui par les sévices et les châtiments exemplaires.<\/p><p>Ces agressions visaient les musulmans faibles et le commun d'entre eux. Quant aux grands et aux notables qui avaient embrassé l'Islam, on les ménageait ; seuls leurs pareils parmi les chefs et les notables des tribus osaient s'en prendre à eux, et encore avec beaucoup de précaution et de prudence.<\/p><aside class=\"notes\"><h4>Notes<\/h4><ol><li id=\"n1\" value=\"1\">L'auteur explique : c'est-à-dire qu'il observe et surveille pour eux depuis un endroit élevé, afin que l'ennemi ne les surprenne pas. <a href=\"#r1\" class=\"back\" aria-label=\"retour\">↩<\/a><\/li><li id=\"n2\" value=\"2\">C'est-à-dire, selon l'explication de l'auteur : je l'entretiendrai comme il le mérite. <a href=\"#r2\" class=\"back\" aria-label=\"retour\">↩<\/a><\/li><\/ol><\/aside>"}, {"id": "s6", "title": "L'attitude des associateurs envers le Messager d'Allah ﷺ", "level": 1, "html": ""}, {"id": "s7", "title": "Les agressions contre le Messager d'Allah ﷺ", "level": 1, "html": ""}, {"id": "s8", "title": "La présentation d'avantages et de tentations", "level": 1, "html": ""}, {"id": "s9", "title": "Le boycott général et l'imposition du blocus", "level": 1, "html": ""}, {"id": "s10", "title": "L'année de la tristesse", "level": 1, "html": ""}, {"id": "s11", "title": "Le Messager ﷺ à Tâ'if", "level": 1, "html": ""}, {"id": "s12", "title": "La dispute des associateurs et leur demande de signes", "level": 1, "html": ""}, {"id": "s13", "title": "Le Voyage nocturne et l'Ascension", "level": 1, "html": ""}, {"id": "s14", "title": "La présentation de l'Islam aux tribus et aux individus", "level": 1, "html": ""}, {"id": "s15", "title": "Le premier serment d'al-ʿAqaba", "level": 1, "html": ""}, {"id": "s16", "title": "Le second serment d'al-ʿAqaba", "level": 1, "html": ""}, {"id": "s17", "title": "L'émigration des musulmans à Médine", "level": 1, "html": ""}, {"id": "s18", "title": "Quraych à Dâr an-Nadwa et sa décision de tuer le Prophète ﷺ", "level": 1, "html": ""}, {"id": "s19", "title": "Entre le plan de Quraych et le plan d'Allah – Gloire à Lui, le Très-Haut", "level": 1, "html": ""}, {"id": "s20", "title": "L'émigration du Prophète ﷺ", "level": 1, "html": ""}, {"id": "s21", "title": "Les œuvres du Messager d'Allah ﷺ à Médine l'illuminée", "level": 1, "html": ""}, {"id": "s22", "title": "Les provocations de Quraych", "level": 1, "html": ""}, {"id": "s23", "title": "La grande bataille de Badr", "level": 1, "html": ""}, {"id": "s24", "title": "La campagne d'Uhud", "level": 1, "html": ""}, {"id": "s25", "title": "Événements et campagnes", "level": 1, "html": ""}, {"id": "s26", "title": "La campagne des Banû an-Nadîr", "level": 1, "html": ""}, {"id": "s27", "title": "La campagne des Coalisés (al-Ahzâb)", "level": 1, "html": ""}, {"id": "s28", "title": "La campagne des Banû Qurayza", "level": 1, "html": ""}, {"id": "s29", "title": "La campagne des Banû al-Mustaliq, ou campagne d'al-Muraysî <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const S=D.sections, T=D.toc, F=D.files, C=D.cur;
const url=(s,a)=>(F[s]||'index.html')+'#'+(a||s);
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('rawda:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('rawda:'+k,JSON.stringify(v))}catch(e){}}};
let cur=-1, saveT=null;
const idx=id=>S.findIndex(s=>s.id===id);

// thème & taille
const themes=['system','light','dark'];
function applyTheme(t){if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);}
let theme=store.get('theme','system');applyTheme(theme);
$('btn-th').onclick=()=>{theme=themes[(themes.indexOf(theme)+1)%3];applyTheme(theme);store.set('theme',theme);toast(theme==='system'?'Thème du système':theme==='light'?'Thème clair':'Thème sombre');};
let fs=store.get('fs',matchMedia('(min-width:1080px)').matches?1.2:1.08);
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'rem');}
applyFs();
$('btn-fm').onclick=()=>{fs=Math.max(.9,+(fs-.06).toFixed(2));applyFs();store.set('fs',fs);};
$('btn-fp').onclick=()=>{fs=Math.min(1.5,+(fs+.06).toFixed(2));applyFs();store.set('fs',fs);};

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

// sommaire
function buildToc(){
  let h='<a href="index.html" data-s="cover" class="l1 solo">Couverture</a>';let open=false;
  for(const [l,tt,s,a] of T){
    if(l===1){if(open)h+='</div></div>';h+=`<div class="grp" data-g="${s}"><div class="gh"><button class="car" aria-label="Déplier ou replier" aria-expanded="false">▸</button><a href="${url(s)}" data-s="${s}" class="l1">${esc(tt)}</a></div><div class="kids">`;open=true;}
    else h+=`<a href="${url(s,a)}" data-s="${s}" class="l${l}">${esc(tt)}</a>`;
  }
  if(open)h+='</div></div>';
  $('toclist').innerHTML=h;
}
$('toclist').addEventListener('click',e=>{const c=e.target.closest('.car');if(c){e.preventDefault();e.stopPropagation();const g=c.closest('.grp');g.classList.toggle('open');c.setAttribute('aria-expanded',g.classList.contains('open'));}},true);
function openGroupOf(sid){const a=$('toclist').querySelector(`a[data-s="${sid}"]`);const g=a&&a.closest('.grp');if(g&&!g.classList.contains('open')){g.classList.add('open');g.querySelector('.car').setAttribute('aria-expanded','true');}}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
buildToc();

// tiroir
function openD(tab){$('drawer').classList.add('open');$('shade').hidden=false;showTab(tab||'toc');
  const c=$('toclist').querySelector('a.cur');if(c&&tab!=='bm')c.scrollIntoView({block:'center'});}
function closeD(){if(wide())return;$('drawer').classList.remove('open');$('shade').hidden=true;}
function wide(){return matchMedia('(min-width:1080px)').matches;}
$('btn-toc').onclick=()=>{if(wide()){const h=document.body.classList.toggle('side-off');store.set('sideoff',h);}else openD('toc');};
if(store.get('sideoff',false))document.body.classList.add('side-off');$('btn-close').onclick=closeD;$('shade').onclick=closeD;
function showTab(t){$('toclist').hidden=t!=='toc';$('bmlist').hidden=t!=='bm';$('tab-toc').classList.toggle('on',t==='toc');$('tab-bm').classList.toggle('on',t==='bm');if(t==='bm')renderBm();}
$('tab-toc').onclick=()=>showTab('toc');$('tab-bm').onclick=()=>showTab('bm');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});
$('toclist').addEventListener('click',e=>{if(e.target.closest('a'))closeD();});

// rendu
function cover(){
  if(C!=='cover'){location.href='index.html';return;}
  cur=-1;
  $('page').innerHTML=`<div class="cover">
  <span class="orn" aria-hidden="true"></span>
  <p class="arttl" lang="ar">روضة الأنوار</p>
  <p class="arsub" lang="ar">في سيرة النبي المختار ﷺ</p>
  <h1>Le jardin des lumières</h1>
  <p class="sub">sur la biographie du Prophète élu ﷺ</p>
  <p class="au">Safî ar-Rahmân al-Mubârakfûrî</p>
  <p class="tr">Huitième édition, 1432 H · traduction française intégrale</p>
  <div class="cta"><button id="go-start">Commencer la lecture</button>${resumeBtn()}</div>
  <div class="rule"></div>
  <p style="color:var(--muted);font-size:.92rem;text-align:center">${S.length} chapitres · versets en arabe vocalisé avec leur traduction et leurs références</p>
  </div>
  <section class="ctoc" aria-labelledby="ctoc-h"><h2 id="ctoc-h">Sommaire</h2><ol>${T.filter(x=>x[0]<=1).map(([l,t,s,a])=>`<li class="c${l}"><a href="${url(s,a)}">${esc(t)}</a></li>`).join('')}</ol></section>`;
  $('go-start').onclick=()=>go(S[0].id);
  const r=$('go-resume');if(r)r.onclick=()=>{const p=store.get('pos',null);go(p.s,null,p.y);};
  $('ttl').innerHTML='<b>Le jardin des lumières</b>';
  setNav();markToc('cover');progress();
}
function resumeBtn(){const p=store.get('pos',null);if(!p||idx(p.s)<0)return '';return `<button class="alt" id="go-resume">Reprendre : ${esc(S[idx(p.s)].title.slice(0,48))}</button>`;}
function go(sid,anchor,y){
  const i=idx(sid);if(i<0){cover();return;}
  if(sid!==C){if(typeof y==='number')store.set('jump',{s:sid,y:y});location.href=url(sid,anchor);return;}
  cur=i;const s=S[i];
  $('page').innerHTML=s.html;
  const part=partOf(i);
  $('ttl').innerHTML=(part&&part!==s.title?esc(short(part))+' · ':'')+'<b>'+esc(short(s.title))+'</b>';
  setNav();markToc(sid);
  const want=anchor||sid;
  if(location.hash.slice(1)!==want)history.replaceState(null,'','#'+want);
  requestAnimationFrame(()=>{
    if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView();progress();return;}}
    if(typeof y==='number'){window.scrollTo(0,y*(document.documentElement.scrollHeight-innerHeight));}
    else window.scrollTo(0,0);
    progress();
  });
}
function short(t){return t.length>60?t.slice(0,58)+'…':t;}
function partOf(i){for(let k=i;k>=0;k--)if(S[k].level===1)return S[k].title;return '';}
function setNav(){
  const p=cur-1,n=cur+1;
  $('prev').disabled=cur<0;$('prevt').textContent=p>=0?S[p].title:'Couverture';
  $('next').disabled=n>=S.length;$('nextt').textContent=n<S.length?S[n].title:'';
}
$('prev').onclick=()=>{if(cur<=0)cover();else go(S[cur-1].id);};
$('next').onclick=()=>{if(cur+1<S.length)go(S[cur+1].id);};
function markToc(sid){$('toclist').querySelectorAll('a').forEach(a=>a.classList.toggle('cur',a.dataset.s===sid&&!a.getAttribute('href').includes('-h')));openGroupOf(sid);if(wide()){const c=$('toclist').querySelector('a.cur');if(c){const r=c.getBoundingClientRect(),d=$('toclist').getBoundingClientRect();if(r.top<d.top||r.bottom>d.bottom)c.scrollIntoView({block:'center'});}}}

// progression
function frac(){const h=document.documentElement.scrollHeight-innerHeight;return h>0?Math.min(1,Math.max(0,scrollY/h)):1;}
function progress(){
  const tot=cur<0?0:(cur+frac())/S.length;
  $('progbar').style.width=(tot*100).toFixed(1)+'%';$('pct').textContent=Math.round(tot*100)+' %';
  if(cur>=0){clearTimeout(saveT);saveT=setTimeout(()=>store.set('pos',{s:S[cur].id,y:frac()}),300);}
}
addEventListener('scroll',progress,{passive:true});addEventListener('resize',progress);

// marque-pages
function nearestHeading(){
  const hs=[...$('page').querySelectorAll('h3[id],h4[id],h5[id]')];let best=null;
  for(const h of hs){if(h.getBoundingClientRect().top<140)best=h;}
  return best;
}
$('btn-bm').onclick=()=>{
  if(cur<0){toast('Ouvrez un chapitre pour poser un marque-page');return;}
  const h=nearestHeading();const list=store.get('bm',[]);
  const item={s:S[cur].id,a:h?h.id:null,y:frac(),t:S[cur].title,h:h?h.textContent:'',d:Date.now()};
  list.unshift(item);store.set('bm',list.slice(0,60));updCount();toast('Marque-page ajouté');
};
function updCount(){const n=store.get('bm',[]).length;$('bmcount').textContent=n?'('+n+')':'';}
function renderBm(){
  const list=store.get('bm',[]);
  if(!list.length){$('bmlist').innerHTML='<p class="empty">Aucun marque-page. Pendant la lecture, touchez « 🔖 Marquer » pour enregistrer l\'endroit où vous êtes.</p>';return;}
  $('bmlist').innerHTML=list.map((b,i)=>`<div class="bm"><a href="#" data-i="${i}">${esc(b.h||b.t)}<small>${esc(b.h?b.t:'')} · ${Math.round(b.y*100)} % du chapitre · ${new Date(b.d).toLocaleDateString('fr-FR')}</small></a><button data-del="${i}" aria-label="Supprimer">✕</button></div>`).join('');
}
$('bmlist').addEventListener('click',e=>{
  const a=e.target.closest('a[data-i]'),d=e.target.closest('button[data-del]');const list=store.get('bm',[]);
  if(a){e.preventDefault();const b=list[+a.dataset.i];closeD();go(b.s,null,b.y);}
  if(d){list.splice(+d.dataset.del,1);store.set('bm',list);updCount();renderBm();}
});
updCount();

// routage
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==='couverture'){cover();return;}
  if(!h){if(C==='cover'){cover();return;}const j=store.get('jump',null);if(j&&j.s===C){store.set('jump',null);go(C,null,j.y);}else go(C);return;}
  const sid=h.split('-')[0];
  if(sid.startsWith('n')||sid.startsWith('r')){ // note: rester dans le chapitre
    const el=document.getElementById(h);if(el)el.scrollIntoView({block:'center'});return;}
  if(idx(sid)<0){cover();return;}
  if(sid===C&&cur<0){const j=store.get('jump',null);if(j&&j.s===C){store.set('jump',null);go(C,null,j.y);return;}}
  if(S[cur]&&S[cur].id===sid){const el=document.getElementById(h);if(el&&h!==sid)el.scrollIntoView();else if(h===sid)scrollTo(0,0);return;}
  go(sid,h!==sid?h:null);
}
  /* ---------- fenêtre des notes ---------- */
  (function () {
    let pop = null, anchor = null;
    function close() { if (pop) { pop.remove(); pop = null; } if (anchor) { anchor.setAttribute('aria-expanded', 'false'); anchor = null; } }
    function place() {
      if (!pop || !anchor) return;
      const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, m = 12;
      let left = Math.min(Math.max(m, r.left + r.width / 2 - w / 2), innerWidth - w - m);
      let top = r.bottom + 8, below = true;
      if (top + h > innerHeight - m && r.top - h - 8 > m) { top = r.top - h - 8; below = false; }
      pop.style.left = left + 'px'; pop.style.top = top + 'px';
      pop.classList.toggle('up', !below);
      pop.style.setProperty('--ax', (r.left + r.width / 2 - left) + 'px');
    }
    document.addEventListener('click', function (e) {
      const a = e.target.closest('sup.fn a');
      if (a) {
        e.preventDefault();
        if (anchor === a) { close(); return; }
        close();
        const id = a.getAttribute('href').slice(1), li = document.getElementById(id);
        if (!li) return;
        const c = li.cloneNode(true); c.querySelectorAll('.back').forEach((x) => x.remove());
        pop = document.createElement('div');
        pop.className = 'notepop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Note ' + a.textContent);
        pop.innerHTML = '<div class="np-h"><span>Note ' + a.textContent + '</span><button class="np-x" aria-label="Fermer">✕</button></div><div class="np-b"></div><a class="np-go" href="#' + id + '">Voir dans la liste des notes ↓</a>';
        pop.querySelector('.np-b').innerHTML = c.innerHTML;
        document.body.appendChild(pop);
        anchor = a; a.setAttribute('aria-expanded', 'true');
        place();
        pop.querySelector('.np-x').onclick = close;
        pop.querySelector('.np-go').onclick = function (ev) { ev.preventDefault(); close(); li.scrollIntoView({ block: 'center' }); li.classList.add('flash'); setTimeout(() => li.classList.remove('flash'), 1600); };
        return;
      }
      if (pop && !e.target.closest('.notepop')) close();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    addEventListener('scroll', place, { passive: true });
    addEventListener('resize', place);
  })();

addEventListener('hashchange',route);
route();
})();
</script>
