@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.7}

a{color:var(--accent)}
button{font:inherit;color:inherit}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:1px solid var(--rule);

.lab{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}

.ctoc{margin-top:2.4em;border-top:1px solid var(--rule);padding-top:1.6em}

.ctoc li a{display:block;text-decoration:none;color:var(--ink);padding:5px 8px;border-radius:4px}
.ctoc li a:hover{background:var(--accent-soft)}

/* sommaire déroulant à gauche */
.grp .gh{display:flex;align-items:flex-start;gap:2px;margin-top:8px}
.grp .gh a{flex:1;margin-top:0}
.car{border:0;background:transparent;color:var(--accent);cursor:pointer;width:26px;height:30px;flex:none;font-size:.85rem;transition:transform .15s;border-radius:4px}
.car:hover{background:var(--accent-soft)}
.grp.open .car{transform:rotate(90deg)}
.grp .kids{display:none;border-left:1px solid var(--rule);margin-left:12px}
.grp.open .kids{display:block}
.dl .l1.solo{margin-left:28px}
.dl .l2{padding-left:12px}.dl .l3{padding-left:24px}.dl .l4{padding-left:36px}.dl .l5{padding-left:48px}

  .shade{display:none!important}
  body:not(.side-off) .bar, body:not(.side-off) main{margin-left:330px}
  body.side-off .drawer{transform:translateX(-102%)}
  .bar,main{transition:margin-left .2s}
}

<script id="data" type="application/json">{"sections": [{"id": "s1", "title": "Présentation de l'auteur et de l'ouvrage", "level": 1, "html": ""}, {"id": "s2", "title": "Introduction de l'auteur", "level": 1, "html": ""}, {"id": "s3", "title": "Muhammad ﷺ : ses origines, sa jeunesse et sa vie avant la prophétie", "level": 1, "html": "<header class=\"sh l1\"><span class=\"orn\" aria-hidden=\"true\"><\/span><h1 class=\"h1\"><span class=\"tt\">Muhammad ﷺ : ses origines, sa jeunesse et sa vie avant la prophétie<\/span><\/h1><\/header><h3 id=\"s3-h4\">La noble généalogie<\/h3><p>Il est la plus noble des créatures d'Allah, le meilleur de Ses messagers et le sceau de Ses prophètes : Muhammad, fils de ʿAbd Allâh, fils de ʿAbd al-Muttalib, fils de Hâchim, fils de ʿAbd Manâf, fils de Qusayy, fils de Kilâb, fils de Murra, fils de Kaʿb, fils de Lu'ayy, fils de Ghâlib, fils de Fihr, fils de Mâlik, fils d'an-Nadr, fils de Kinâna, fils de Khuzayma, fils de Mudrika, fils d'Ilyâs, fils de Mudar, fils de Nizâr, fils de Maʿadd, fils de ʿAdnân.<\/p><p>ʿAdnân est, de l'avis unanime, de la descendance d'Ismâʿîl, fils d'Ibrâhîm – sur eux deux la paix –, mais on ne connaît avec précision ni le nombre ni les noms de ceux qui se trouvent entre lui et Ismâʿîl – sur lui la paix.<\/p><p>Quant à sa mère ﷺ, c'est Âmina, fille de Wahb, fils de ʿAbd Manâf, fils de Zuhra, fils de Kilâb. Kilâb est le cinquième aïeul du Prophète ﷺ du côté de son père ; son père et sa mère sont donc d'une même souche et se rejoignent en Kilâb. Le nom de celui-ci était Hakîm – on a dit aussi : ʿUrwa –, mais comme il chassait beaucoup avec des chiens (kilâb), il fut connu par ce surnom.<\/p><p>Sa tribu ﷺ est la tribu de Quraych, reconnue pour sa noblesse, l'élévation de son rang, sa gloire ancestrale et la sainteté de sa position parmi tous les Arabes. Quraych est le surnom de Fihr ibn Mâlik, ou d'an-Nadr ibn Kinâna.<\/p><p>Tous les hommes de cette tribu furent des seigneurs et des notables en leur temps. Parmi eux, Qusayy – dont le nom était Zayd – se distingua par plusieurs mérites : il fut le premier de Quraych à prendre en charge la Kaʿba ; il en détenait la garde et le service (al-hijâba wa as-sidâna), c'est-à-dire qu'il avait en main la clé de la Kaʿba, qu'il ouvrait à qui il voulait et quand il voulait. C'est lui qui installa Quraych au fond de la vallée de La Mecque et les fit habiter à l'intérieur de la ville, alors qu'auparavant ils vivaient dans ses environs et à ses abords, dispersés parmi d'autres tribus. C'est lui qui institua l'abreuvement (as-siqâya) et l'approvisionnement (ar-rifâda). As-siqâya est une eau douce préparée avec des dattes, du miel, des raisins secs ou autre, qu'il faisait mettre dans des bassins de cuir pour que les pèlerins en boivent. Ar-rifâda est la nourriture que l'on préparait pour eux pendant la saison du pèlerinage. Qusayy construisit au nord de la Kaʿba une maison connue sous le nom de Dâr an-Nadwa : c'était la maison de concertation de Quraych et le centre de leur vie sociale ; aucun mariage n'était conclu et aucune affaire n'était décidée ailleurs que dans cette maison. Il détenait l'étendard et le commandement : aucune bannière de guerre n'était nouée sinon de sa main. Il était généreux, d'une grande intelligence, et sa parole faisait autorité parmi les siens.<\/p><h3 id=\"s3-h5\">Sa famille ﷺ<\/h3><p>Sa famille ﷺ est connue sous le nom de famille hâchimite, par rattachement à son deuxième aïeul, Hâchim.<\/p><p>Hâchim avait hérité de Qusayy deux de ses charges : l'abreuvement et l'approvisionnement. Après lui, elles passèrent à son frère al-Muttalib, puis aux fils de Hâchim, qui les détenaient encore à l'avènement de l'Islam. Hâchim était le plus grand homme de son temps. Il émiettait (yahchimu) le pain dans la viande pour en faire du tharîd, puis laissait les gens en manger ; c'est pourquoi on le surnomma Hâchim, alors que son nom était ʿAmr. C'est lui qui institua les deux voyages : celui de l'hiver vers le Yémen et celui de l'été vers le Châm. On l'appelait « le seigneur d'al-Bathâ' ».<\/p><p>Parmi ce que l'on rapporte de lui : il passa par Yathrib alors qu'il se rendait au Châm pour son commerce. Il y épousa Salmâ, fille de ʿAmr, des Banû ʿAdî ibn an-Najjâr, et demeura un temps auprès d'elle. Puis il repartit pour le Châm alors qu'elle était enceinte, et il mourut à Gaza, en terre de Palestine. Salmâ mit au monde un fils à Médine, qu'elle nomma Chayba, à cause de cheveux blancs (chayb) qu'il avait sur la tête. Cet enfant grandit parmi ses oncles maternels à Médine, sans que ses oncles paternels de La Mecque n'apprennent son existence, jusqu'à ce qu'il atteigne l'âge de sept ou huit ans. Son oncle al-Muttalib en fut alors informé et l'emmena à La Mecque. Lorsque les gens le virent, ils pensèrent que c'était son esclave et dirent : « ʿAbd al-Muttalib » (l'esclave d'al-Muttalib). C'est ainsi qu'il fut connu.<\/p><p>ʿAbd al-Muttalib était le plus avenant des hommes, le plus beau et le plus considérable. Il atteignit en son temps un honneur qu'aucun autre n'atteignit : il fut le seigneur de Quraych et le chef de la caravane de La Mecque, noble, obéi, généreux, surnommé « al-Fayyâd » (le Débordant) à cause de sa largesse.<\/p><p>Il faisait porter les restes de sa table aux pauvres, aux bêtes sauvages et aux oiseaux, si bien qu'on le surnommait « celui qui nourrit les hommes dans la plaine, et les bêtes sauvages et les oiseaux au sommet des montagnes ». Il eut l'honneur de creuser le puits de Zamzam, après que les Jurhum l'eurent effacé lorsqu'ils furent chassés de La Mecque. Il avait reçu en songe l'ordre de le creuser, et l'emplacement lui en avait été décrit.<\/p><p>C'est à son époque qu'eut lieu l'épisode de l'Éléphant. Abraha al-Achram vint du Yémen avec soixante mille soldats abyssins, accompagnés de quelques éléphants, pour détruire la Kaʿba. Lorsqu'il parvint à la vallée de Muhassir, entre Muzdalifa et Minâ, et se prépara à attaquer La Mecque, Allah envoya contre eux des oiseaux par volées qui leur lançaient des pierres d'argile cuite, et Il les rendit semblables à de la paille mâchée. Cela se produisit moins de deux mois seulement avant la naissance du Prophète ﷺ.<\/p><p>Quant à son père ﷺ, ʿAbd Allâh, il était le meilleur des fils de ʿAbd al-Muttalib, le plus chaste et le plus aimé de lui. C'est lui « le sacrifié » (adh-dhabîh). En effet, lorsque ʿAbd al-Muttalib creusa le puits de Zamzam et que ses traces apparurent, Quraych lui en disputa la possession. Il fit alors le vœu que, si Allah lui donnait dix fils qui atteindraient l'âge de le défendre, il sacrifierait l'un d'eux. Lorsque cela se réalisa, il tira au sort entre ses fils, et le sort tomba sur ʿAbd Allâh. Il l'emmena à la Kaʿba pour le sacrifier, mais Quraych l'en empêcha, en particulier ses frères et ses oncles maternels. Il le racheta alors par cent chameaux. Le Prophète ﷺ est donc le fils des deux sacrifiés – Ismâʿîl, sur lui la paix,<\/p><p>et ʿAbd Allâh – et le fils des deux rachetés : Ismâʿîl, sur lui la paix, fut racheté par un bélier, et ʿAbd Allâh par cent chameaux.<\/p><p>ʿAbd al-Muttalib choisit pour son fils ʿAbd Allâh Âmina, fille de Wahb, qui était la meilleure des femmes de Quraych par sa noblesse et son rang ; son père Wahb était le seigneur des Banû Zuhra par la lignée et l'honneur. Les fiançailles et le mariage furent conclus ; ʿAbd Allâh consomma le mariage à La Mecque, et elle conçut le Messager d'Allah ﷺ.<\/p><p>Quelque temps après, ʿAbd al-Muttalib l'envoya à Médine – ou au Châm pour un commerce. Il mourut à Médine, au retour du Châm, et fut enterré dans la maison d'an-Nâbigha adh-Dhubyânî. Cela eut lieu avant la naissance du Prophète ﷺ, selon l'avis le plus juste.<\/p><h3 id=\"s3-h6\">La naissance<\/h3><p>Le Messager d'Allah ﷺ naquit dans le quartier (chiʿb) des Banû Hâchim à La Mecque, au matin du lundi 9 – on dit aussi le 12 – du mois de Rabîʿ al-Awwal de l'année de l'Éléphant. La première date est la plus juste, la seconde la plus répandue. Cela correspond au 22 avril de l'an 571 de l'ère chrétienne.<\/p><p>Sa sage-femme fut ach-Chifâ', fille de ʿAmr, mère de ʿAbd ar-Rahmân ibn ʿAwf – qu'Allah l'agrée. Lorsque sa mère le mit au monde, il sortit d'elle une lumière qui illumina pour elle les palais du Châm. Elle fit annoncer la bonne nouvelle de sa naissance ﷺ à son grand-père ʿAbd al-Muttalib.<\/p><p>ʿAbd al-Muttalib vint, joyeux et heureux ; il le prit dans ses bras, l'emmena dans la Kaʿba, remercia Allah et L'invoqua. Il le nomma Muhammad, dans l'espoir qu'il soit loué. Il sacrifia pour lui (la ʿaqîqa), le circoncit le septième jour et donna à manger aux gens, comme les Arabes avaient coutume de le faire.<\/p><p>Sa nourrice (hâdina) fut Umm Ayman, Baraka l'Abyssine, affranchie de son père ʿAbd Allâh. Elle vécut jusqu'à embrasser l'Islam et émigrer, et mourut cinq ou six mois après le Prophète ﷺ.<\/p><h3 id=\"s3-h7\">L'allaitement<\/h3><p>La première à l'allaiter ﷺ après sa mère fut Thuwayba, l'affranchie d'Abû Lahab, avec le lait d'un fils à elle nommé Masrûh. Elle avait allaité avant lui ﷺ Hamza ibn ʿAbd al-Muttalib, et après lui ﷺ Abû Salama ibn ʿAbd al-Asad al-Makhzûmî ; ce sont donc ses frères de lait ﷺ.<\/p><p>Abû Lahab avait affranchi cette servante, dans la joie de la naissance du Messager d'Allah ﷺ ; mais il devint l'un de ses ennemis les plus acharnés lorsque celui-ci se mit à appeler à l'Islam.<\/p><h3 id=\"s3-h8\">Chez les Banû Saʿd<\/h3><p>Les Arabes avaient coutume de chercher, pour leurs nouveau-nés, des nourrices dans le désert, afin de les éloigner des maladies des villes, de fortifier leur constitution, et pour qu'ils maîtrisent la langue arabe dès le berceau.<\/p><p>Allah décréta que vinrent des femmes des Banû Saʿd ibn Bakr ibn Hawâzin cherchant des nourrissons. Le Prophète ﷺ leur fut proposé à toutes, mais elles refusèrent de l'allaiter parce qu'il était orphelin. L'une de ces femmes – Halîma, fille d'Abû Dhu'ayb – ne trouva aucun nourrisson ; elle le prit donc ﷺ, et elle obtint grâce à lui une faveur que les autres lui envièrent.<\/p><p>Le nom d'Abû Dhu'ayb, père de Halîma, est ʿAbd Allâh ibn al-Hârith, et le nom de son mari est al-Hârith ibn ʿAbd al-ʿUzzâ, tous deux des Saʿd ibn Bakr ibn Hawâzin. Les enfants d'al-Hârith ibn ʿAbd al-ʿUzzâ sont ses frères et sœurs de lait ﷺ : ʿAbd Allâh, Unaysa et Judâma – c'est ach-Chaymâ', surnom qui l'emporta sur son nom ; elle portait le Messager d'Allah ﷺ dans ses bras.<\/p><h3 id=\"s3-h9\">Les bénédictions dans la maison de l'allaitement<\/h3><p>Les bénédictions se répandirent abondamment sur les gens de cette maison tant qu'il ﷺ fut parmi eux.<\/p><p>Parmi ce que l'on rapporte de ces bénédictions : lorsque Halîma vint à La Mecque, c'était une période de sécheresse et de disette. Elle avait avec elle une ânesse, la monture la plus lente de la caravane à cause de sa faiblesse et de sa maigreur, et une chamelle qui ne donnait pas une goutte de lait. Elle avait un petit enfant qui pleurait et criait toute la nuit à cause de la faim, ne dormait pas et ne laissait pas dormir ses parents.<\/p><p>Lorsque Halîma amena le Prophète ﷺ à sa tente et le posa sur ses genoux, ses seins vinrent à lui avec tout le lait qu'il voulut ; il but jusqu'à être rassasié, et son petit frère but avec lui jusqu'à être rassasié, puis ils s'endormirent.<\/p><p>Son mari alla vers la chamelle et la trouva pleine de lait ; il en tira de quoi les désaltérer et les rassasier tous deux, et ils passèrent la meilleure des nuits.<\/p><p>Lorsqu'ils repartirent vers le désert des Banû Saʿd, Halîma monta cette ânesse, portant avec elle le Prophète ﷺ ; l'ânesse alla si vite qu'elle dépassa toute la caravane, et aucun âne ne put la rattraper.<\/p><p>Lorsqu'ils arrivèrent dans leur pays, le pays des Banû Saʿd – qui était la terre la plus aride qu'Allah ait créée –, leurs moutons revenaient le soir rassasiés, les flancs pleins de fourrage et les mamelles pleines de lait. Ils trayaient et buvaient, alors que les autres ne trayaient pas une goutte de lait.<\/p><p>Ils ne cessèrent de recevoir d'Allah surcroît et bien, jusqu'à ce que la période d'allaitement fût achevée. Deux années s'écoulèrent, et Halîma le sevra ; il était devenu, durant cette période, robuste et fort.<\/p><h3 id=\"s3-h10\">Le séjour du Prophète ﷺ chez les Banû Saʿd après l'allaitement<\/h3><p>Halîma amenait le Prophète ﷺ à sa mère et à sa famille tous les six<\/p><p>mois, puis le ramenait dans son désert, chez les Banû Saʿd. Lorsque la période d'allaitement fut achevée, qu'elle l'eut sevré et qu'elle l'amena à sa mère, elle tint à ce qu'il ﷺ reste chez elle, à cause de la bénédiction et du bien qu'elle avait vus. Elle demanda donc à la mère du Prophète ﷺ de le lui laisser jusqu'à ce qu'il soit plus robuste, car elle craignait pour lui l'épidémie de La Mecque. Sa mère y consentit, et Halîma le ramena chez elle, joyeuse et heureuse. Le Prophète ﷺ resta encore chez elle environ deux ans. Puis survint un événement étrange qui effraya Halîma et son mari, au point qu'ils rendirent le Prophète ﷺ à sa mère. Cet événement est l'ouverture de sa poitrine ﷺ, que voici exposée.<\/p><h3 id=\"s3-h11\">L'ouverture de la poitrine<\/h3><p>Anas ibn Mâlik – qu'Allah l'agrée – a dit : « Jibrîl vint au Messager d'Allah ﷺ alors qu'il jouait avec les garçons. Il le prit, le coucha à terre, lui ouvrit [la poitrine] au niveau du cœur, en sortit le cœur et en retira un caillot de sang, puis dit : \"Ceci est la part du Diable en toi.\" Puis il le lava dans une bassine d'or avec de l'eau de Zamzam, le referma – c'est-à-dire le rassembla et le rejoignit – et le remit à sa place.<\/p><p>« Les garçons accoururent vers sa mère – c'est-à-dire sa nourrice – et dirent : \"Muhammad a été tué !\" Ils allèrent à sa rencontre, et il avait le teint altéré. »<\/p><p>Anas a dit : « Je voyais la trace de cette couture sur sa poitrine. »<\/p><p>Après cet événement, le Prophète ﷺ revint à La Mecque. Il demeura environ deux ans auprès de sa mère et dans sa famille. Puis sa mère voyagea avec lui jusqu'à Médine, où se trouvaient la tombe de son père et les oncles maternels de son grand-père, les Banû ʿAdî ibn an-Najjâr. ʿAbd al-Muttalib, qui avait la charge de sa famille, l'accompagnait, ainsi que sa servante Umm Ayman. Elle y resta un mois, puis repartit. En chemin, la maladie la saisit et s'aggrava jusqu'à ce qu'elle meure à al-Abwâ', entre La Mecque et Médine ; elle y fut enterrée.<\/p><h3 id=\"s3-h12\">Auprès de son grand-père affectueux<\/h3><p>Son grand-père ʿAbd al-Muttalib le ramena ﷺ à La Mecque, ressentant au plus profond de son cœur la douleur de ce nouveau malheur. Il éprouva pour lui une tendresse qu'il n'avait éprouvée pour aucun de ses propres enfants : il l'honorait, le faisait passer avant ses fils, le comblait d'égards, le faisait asseoir sur sa couche personnelle, sur laquelle personne d'autre ne s'asseyait, lui caressait le dos, se réjouissait de ce qu'il le voyait faire, et croyait qu'il aurait à l'avenir un rang immense. Mais il mourut deux ans plus tard, alors que le Prophète ﷺ avait huit ans, deux mois et dix jours.<\/p><h3 id=\"s3-h13\">Auprès de son oncle compatissant<\/h3><p>Sa tutelle ﷺ fut alors assurée par son oncle paternel Abû Tâlib, frère germain de son père, qui lui réserva un surcroît<\/p><p>de miséricorde et d'affection. Il avait peu de biens, mais Allah bénit ce peu, au point que la nourriture d'un seul suffisait à rassasier toute sa famille. Le Messager ﷺ était un modèle de contentement et de patience, se satisfaisant de ce qu'Allah lui avait destiné.<\/p><h3 id=\"s3-h14\">Son voyage au Châm et le moine Bahîrâ<\/h3><p>Abû Tâlib voulut partir commercer au Châm avec la caravane de Quraych. Le Prophète ﷺ avait alors douze ans – on a dit : et deux mois et dix jours. Le Messager d'Allah ﷺ trouva très pénible de se séparer de lui ; Abû Tâlib s'attendrit et l'emmena avec lui. Lorsque la caravane fit halte près de la ville de Busrâ, aux confins du Châm, l'un des grands moines chrétiens – le moine Bahîrâ – sortit à leur rencontre. Il se faufila parmi les voyageurs jusqu'à parvenir au Prophète ﷺ, lui prit la main et dit :<\/p><p>« Celui-ci est le seigneur des mondes ; celui-ci est le messager du Seigneur des mondes ; Allah l'enverra comme miséricorde pour les mondes. »<\/p><p>Ils dirent : « Et comment sais-tu cela ? »<\/p><p>Il répondit : « Lorsque vous êtes apparus en haut du col, il ne resta ni pierre ni arbre qui ne tombât prosterné ; or ils ne se prosternent que devant un prophète. Et je le reconnais au sceau de la prophétie, au bas du cartilage de son épaule, semblable à une pomme. Nous le trouvons [décrit] dans nos livres. »<\/p><p>Puis il les honora de son hospitalité et demanda à Abû Tâlib de le ramener et de ne pas l'emmener<\/p><p>au Châm, par crainte des Juifs et des Byzantins. Abû Tâlib le ramena donc à La Mecque.<\/p><h3 id=\"s3-h15\">La guerre d'al-Fijâr<\/h3><p>Lorsqu'il ﷺ avait vingt ans, une guerre éclata au marché de ʿUkâz entre les tribus de Quraych et de Kinâna d'une part, et les tribus de Qays ʿAylân d'autre part. Les combats furent violents, et un certain nombre d'hommes des deux camps furent tués. Puis ils firent la paix en convenant de dénombrer les morts des deux camps : le camp qui compterait le plus de morts recevrait le prix du sang pour l'excédent. Ils déposèrent les armes et mirent fin à l'hostilité et au mal qui s'étaient installés entre eux.<\/p><p>Le Messager d'Allah ﷺ assista à cette guerre ; il ramassait les flèches pour ses oncles, c'est-à-dire qu'il leur préparait les flèches pour le tir.<\/p><p>Cette guerre fut appelée « guerre d'al-Fijâr » (guerre de l'impiété) parce qu'ils y violèrent l'inviolabilité du territoire sacré de La Mecque et du mois sacré. Il y eut quatre guerres d'al-Fijâr, chacune en une année différente, et celle-ci fut la dernière. Les trois premières se terminèrent après une querelle et une échauffourée légère ; il n'y eut de véritables combats que lors de la quatrième.<\/p><h3 id=\"s3-h16\">Le pacte d'al-Fudûl<\/h3><p>Au mois de Dhû al-Qaʿda, à la suite de cette guerre, fut conclu le pacte d'al-Fudûl entre cinq clans de la tribu de Quraych : les Banû Hâchim, les Banû al-Muttalib,<\/p><p>les Banû Asad, les Banû Zuhra et les Banû Taym.<\/p><p>Sa cause fut la suivante : un homme de Zabîd vint à La Mecque avec une marchandise ; al-ʿÂs ibn Wâ'il as-Sahmî la lui acheta et retint ce qu'il lui devait. L'homme demanda secours contre lui aux Banû ʿAbd ad-Dâr, aux Banû Makhzûm, aux Banû Jumah, aux Banû Sahm et aux Banû ʿAdî, mais ils ne lui prêtèrent aucune attention. Il monta alors sur le mont Abû Qubays, exposa l'injustice qu'il avait subie dans quelques vers, et appela quiconque l'aiderait à recouvrer son droit. Az-Zubayr ibn ʿAbd al-Muttalib s'employa à cette affaire, jusqu'à ce que ceux que nous avons mentionnés se réunissent dans la maison de ʿAbd Allâh ibn Judʿân, chef des Banû Taym. Ils firent alliance et s'engagèrent à ne trouver à La Mecque aucun opprimé, qu'il soit de ses habitants ou d'ailleurs, sans se dresser à ses côtés jusqu'à ce que justice lui soit rendue. Puis ils se rendirent chez al-ʿÂs ibn Wâ'il as-Sahmî, lui arrachèrent le dû de l'homme de Zabîd et le lui remirent.<\/p><p>Le Messager d'Allah ﷺ assista à ce pacte avec ses oncles. Après qu'Allah l'eut honoré du message, il dit :<\/p><figure class=\"cite hadith\"><div class=\"lab\">Texte arabe (hadith)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">لقد شهدت في دار عبد الله بن جدعان حلفا ما أحب أن لي به حمر النعم، ولو أدعى به في الإسلام لأجبت<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« J'ai assisté, dans la maison de ʿAbd Allâh ibn Judʿân, à un pacte que je n'échangerais pas contre les chameaux roux ; et si j'y étais appelé en Islam, j'y répondrais. »<\/p><\/blockquote><\/figure><h3 id=\"s3-h17\">La vie de travail<\/h3><p>On sait que le Prophète ﷺ naquit orphelin et grandit sous la tutelle de son grand-père, puis de son oncle. Il n'hérita de son père rien qui pût le dispenser du besoin. Lorsqu'il atteignit l'âge auquel on travaille habituellement,<\/p><p>il fit paître les moutons avec ses frères de lait chez les Banû Saʿd ; et lorsqu'il revint à La Mecque, il les fit paître pour ses habitants contre quelques qîrâts. Le qîrât est une petite fraction du dinar : la moitié d'un dixième, ou le tiers d'un huitième. Sa valeur, à notre époque, est d'environ dix riyals.<\/p><p>Faire paître les moutons est l'une des pratiques des prophètes au début de leur vie. Il ﷺ a dit un jour, après qu'Allah l'eut honoré de la prophétie :<\/p><figure class=\"cite hadith\"><div class=\"lab\">Texte arabe (hadith)<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">ما من نبي إلا ورعاها<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>« Il n'est pas un prophète qui ne les ait fait paître. »<\/p><\/blockquote><\/figure><p>Lorsque le Prophète ﷺ devint jeune homme et atteignit l'âge adulte, il semble qu'il pratiquait le commerce. Il est rapporté en effet qu'il commerçait avec as-Sâ'ib ibn Abî as-Sâ'ib, et qu'il était pour lui le meilleur des associés : il ne le dupait pas et ne se querellait pas avec lui.<\/p><p>Il ﷺ était connu, dans ses transactions, pour son extrême loyauté, sa véracité et sa probité. Telle était sa conduite ﷺ dans tous les domaines de la vie, au point qu'on le surnomma al-Amîn (le Digne de confiance).<\/p><h3 id=\"s3-h18\">Son voyage au Châm pour commercer avec les biens de Khadîja<\/h3><p>Khadîja, fille de Khuwaylid – qu'Allah l'agrée –, était l'une des meilleures femmes de Quraych par sa noblesse et sa richesse. Elle confiait ses biens à des marchands qui les faisaient fructifier contre rémunération. Lorsqu'elle entendit parler du Prophète ﷺ, elle lui proposa de partir au Châm comme marchand avec ses biens, et de lui donner plus qu'elle n'avait donné à d'autres.<\/p><p>Le Messager d'Allah ﷺ partit pour le Châm avec son serviteur Maysara. Il vendit, acheta et réalisa un bénéfice considérable ; les biens de Khadîja connurent une bénédiction qu'ils n'avaient jamais connue auparavant. Puis il revint à La Mecque et rendit le dépôt.<\/p><h3 id=\"s3-h19\">Son mariage avec Khadîja<\/h3><p>Khadîja constata une loyauté et une bénédiction qui émerveillent les cœurs. Maysara lui raconta ce qu'il avait vu chez le Prophète ﷺ de noblesse de caractère et de douceur de qualités – on dit aussi : ainsi que certains prodiges, comme deux anges qui lui faisaient de l'ombre dans la chaleur. Khadîja sentit qu'elle trouverait en lui ce qu'elle souhaitait. Elle lui envoya l'une de ses amies pour lui faire part de son désir de l'épouser. Le Prophète ﷺ y consentit et en parla à ses oncles, qui la demandèrent pour lui en mariage à son oncle ʿAmr ibn Asad. Son oncle la maria au Prophète ﷺ en présence des Banû Hâchim et des chefs de Quraych, moyennant une dot de vingt jeunes chamelles – on a dit : six. Celui qui prononça le sermon du mariage fut son oncle Abû Tâlib : il loua Allah et Le glorifia, puis mentionna la noblesse de la lignée et le mérite du Prophète ﷺ, puis prononça la formule du contrat et précisa la dot.<\/p><p>Ce mariage eut lieu deux mois et quelques jours après son retour ﷺ du Châm. Il avait alors vingt-cinq ans. Quant à Khadîja, l'avis le plus répandu est qu'elle avait quarante ans ; on a dit vingt-huit ans, et on a dit autre chose<\/p><p>encore. Elle avait d'abord été mariée à ʿAtîq ibn ʿÂ'idh al-Makhzûmî, qui mourut ; puis elle épousa Abû Hâla at-Tamîmî, qui mourut lui aussi, après lui avoir laissé un enfant. Ensuite, les plus grands chefs de Quraych désirèrent l'épouser, mais elle refusa, jusqu'à ce qu'elle désire le Messager d'Allah ﷺ et l'épouse. Elle connut avec lui un bonheur que lui envieraient les premiers comme les derniers.<\/p><p>Elle fut la première de ses épouses ﷺ ; il n'en épousa aucune autre avec elle jusqu'à sa mort. Tous ses enfants ﷺ sont d'elle, sauf Ibrâhîm, qui est de Mâriya la Copte.<\/p><h3 id=\"s3-h20\">Ses enfants ﷺ de Khadîja<\/h3><p>Ce sont : al-Qâsim, puis Zaynab, puis Ruqayya, puis Umm Kulthûm, puis Fâtima, puis ʿAbd Allâh. On a donné d'autres avis sur leur nombre et leur ordre. Les garçons moururent tous en bas âge. Quant aux filles, elles connurent toutes l'époque de la prophétie : elles embrassèrent l'Islam et émigrèrent, puis la mort les emporta avant le Prophète ﷺ, sauf Fâtima – qu'Allah l'agrée –, qui vécut six mois après lui ﷺ.<\/p><h3 id=\"s3-h21\">La reconstruction de la Maison et l'histoire de l'arbitrage<\/h3><p>Lorsqu'il ﷺ eut trente-cinq ans, un torrent dévastateur fissura les murs de la Kaʿba, qui avaient déjà été affaiblis auparavant par un incendie. Quraych fut contrainte de la reconstruire. Ils décidèrent de n'employer<\/p><p>pour sa dépense que des biens purs : ils n'y feraient entrer ni le salaire d'une prostituée, ni le produit d'une vente usuraire, ni un bien pris injustement à quelqu'un. Ils redoutaient le châtiment d'Allah s'ils la démolissaient ; al-Walîd ibn al-Mughîra dit alors : « Allah ne fait pas périr ceux qui réforment. » Puis il commença à démolir, et ils le suivirent dans la démolition jusqu'à atteindre les fondations d'Ibrâhîm.<\/p><p>Puis ils entreprirent la construction, attribuant à chaque tribu une partie. Les notables portaient les pierres sur leurs épaules ; le Messager d'Allah ﷺ et son oncle al-ʿAbbâs étaient parmi ceux qui portaient. La construction fut confiée à un maçon byzantin nommé Bâqûm.<\/p><p>Les biens purs ne suffirent pas pour l'achever sur les fondations d'Ibrâhîm. Ils en retranchèrent donc environ six coudées du côté nord, et bâtirent sur cette partie un muret pour indiquer qu'elle fait partie de la Kaʿba. C'est la partie connue sous le nom d'al-Hijr et d'al-Hatîm.<\/p><p>Lorsque la construction atteignit l'emplacement de la Pierre noire, chaque chef voulut avoir l'honneur de la remettre à sa place. Une dispute et une querelle éclatèrent entre eux ; elle dura quatre ou cinq jours et faillit tourner à une guerre sanglante dans le territoire sacré. Mais Abû Umayya ibn al-Mughîra al-Makhzûmî – qui était le plus âgé des hommes de Quraych – y remédia avec sagesse : il leur proposa de prendre pour arbitre le premier homme qui entrerait par la porte de la Mosquée. Ils acceptèrent et en convinrent.<\/p><p>Allah décréta que le premier à entrer après cette décision fût le Messager d'Allah ﷺ. Lorsqu'ils le virent, ils s'écrièrent : « Voici al-Amîn ! Nous l'acceptons. C'est Muhammad ! » Lorsqu'il arriva près d'eux et qu'ils l'informèrent de l'affaire, il prit un manteau, y plaça la Pierre noire, et ordonna à chacun d'eux de tenir un bord du manteau et de le soulever. Lorsque la Pierre noire parvint à son emplacement, le Prophète ﷺ la prit de sa main et la mit à sa place. Ce fut une solution judicieuse qui satisfit tout le monde.<\/p><p>La Pierre noire est à un mètre et demi au-dessus du sol de l'aire de circumambulation. Quant à la porte, ils la surélevèrent d'environ deux mètres, afin que n'entre que celui qu'ils voudraient. Quant aux murs, ils les élevèrent à dix-huit coudées, alors qu'ils n'en avaient que la moitié. Ils dressèrent à l'intérieur de la Kaʿba six colonnes sur deux rangées, puis la couvrirent d'un toit à une hauteur de quinze coudées ; auparavant, elle n'avait ni toit ni colonne.<\/p><h3 id=\"s3-h22\">Sa conduite ﷺ avant la mission<\/h3><p>Dès son enfance, il ﷺ grandit avec une raison saine, des facultés pleines et une réputation sans tache. Il grandit, devint jeune homme et mûrit en réunissant les qualités louables et les nobles vertus. Il était un modèle éminent de pensée juste et de vue droite, et l'exemple accompli des nobles caractères et des belles qualités. Il se distinguait par la véracité, la loyauté, la dignité (al-murû'a), le courage, la justice, la sagesse,<\/p><p>la chasteté, le détachement, le contentement, la longanimité, la patience et la gratitude, la pudeur, la fidélité, l'humilité et le bon conseil.<\/p><p>Il était au sommet de la bonté et de la bienfaisance, comme l'a dit son oncle Abû Tâlib :<\/p><figure class=\"cite arabic\"><div class=\"lab\">Texte arabe<\/div><blockquote class=\"ar\" lang=\"ar\" dir=\"rtl\">وأبيض يستسقى الغمام بوجهه <br> ثمال اليتامى عصمة للأرامل<\/blockquote><div class=\"lab\">Traduction française<\/div><blockquote class=\"fr\"><p>Un homme au visage blanc par lequel on demande la pluie aux nuages, soutien des orphelins et rempart des veuves.<\/p><\/blockquote><\/figure><p>Il entretenait les liens de parenté, supportait ce qui pesait sur les épaules des gens, aidait celui qui était démuni jusqu'à ce qu'il trouve de quoi gagner sa vie. Il offrait l'hospitalité à l'hôte et secourait celui qui était frappé par les malheurs.<\/p><p>Allah l'entoura de Sa protection et de Sa sollicitude, et lui fit détester les superstitions et les maux qui étaient répandus parmi son peuple. Il n'assista pas aux fêtes des idoles ni aux célébrations du polythéisme ; il ne mangea pas de ce qui était égorgé sur les pierres dressées ou de ce qui était consacré à un autre qu'Allah. Il ne supportait pas d'entendre jurer par al-Lât et al-ʿUzzâ, et encore moins de toucher les idoles ou de chercher à s'en rapprocher.<\/p><p>Il était le plus éloigné des gens de la consommation du vin et de la fréquentation des divertissements, au point qu'il n'assista pas aux réunions de divertissement et de veillée ni à leurs cercles, qui étaient le lieu de promenade des jeunes gens et le rendez-vous des amis à La Mecque.<\/p>"}, {"id": "s4", "title": "La prophétie et l'appel", "level": 1, "html": ""}, {"id": "s5", "title": "La proclamation publique de l'appel", "level": 1, "html": ""}, {"id": "s6", "title": "L'attitude des associateurs envers le Messager d'Allah ﷺ", "level": 1, "html": ""}, {"id": "s7", "title": "Les agressions contre le Messager d'Allah ﷺ", "level": 1, "html": ""}, {"id": "s8", "title": "La présentation d'avantages et de tentations", "level": 1, "html": ""}, {"id": "s9", "title": "Le boycott général et l'imposition du blocus", "level": 1, "html": ""}, {"id": "s10", "title": "L'année de la tristesse", "level": 1, "html": ""}, {"id": "s11", "title": "Le Messager ﷺ à Tâ'if", "level": 1, "html": ""}, {"id": "s12", "title": "La dispute des associateurs et leur demande de signes", "level": 1, "html": ""}, {"id": "s13", "title": "Le Voyage nocturne et l'Ascension", "level": 1, "html": ""}, {"id": "s14", "title": "La présentation de l'Islam aux tribus et aux individus", "level": 1, "html": ""}, {"id": "s15", "title": "Le premier serment d'al-ʿAqaba", "level": 1, "html": ""}, {"id": "s16", "title": "Le second serment d'al-ʿAqaba", "level": 1, "html": ""}, {"id": "s17", "title": "L'émigration des musulmans à Médine", "level": 1, "html": ""}, {"id": "s18", "title": "Quraych à Dâr an-Nadwa et sa décision de tuer le Prophète ﷺ", "level": 1, "html": ""}, {"id": "s19", "title": "Entre le plan de Quraych et le plan d'Allah – Gloire à Lui, le Très-Haut", "level": 1, "html": ""}, {"id": "s20", "title": "L'émigration du Prophète ﷺ", "level": 1, "html": ""}, {"id": "s21", "title": "Les œuvres du Messager d'Allah ﷺ à Médine l'illuminée", "level": 1, "html": ""}, {"id": "s22", "title": "Les provocations de Quraych", "level": 1, "html": ""}, {"id": "s23", "title": "La grande bataille de Badr", "level": 1, "html": ""}, {"id": "s24", "title": "La campagne d'Uhud", "level": 1, "html": ""}, {"id": "s25", "title": "Événements et campagnes", "level": 1, "html": ""}, {"id": "s26", "title": "La campagne des Banû an-Nadîr", "level": 1, "html": ""}, {"id": "s27", "title": "La campagne des Coalisés (al-Ahzâb)", "level": 1, "html": ""}, {"id": "s28", "title": "La campagne des Banû Qurayza", "level": 1, "html": ""}, {"id": "s29", "title": "La campagne des Banû al-Mustaliq, ou campagne d'al-Muraysîʿ", "level": 1, "html": ""}, {"id": "s30", "title": "La ʿumra d'al-Hudaybiya", "level": 1, "html": ""}, {"id": "s31", "title": "La correspondance avec les rois et les princes", "level": 1, "html": ""}, {"id": "s32", "title": "Entre les musulmans et les autres parties", "level": 1, "html": ""}, {"i <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const S=D.sections, T=D.toc, F=D.files, C=D.cur;
const url=(s,a)=>(F[s]||'index.html')+'#'+(a||s);
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('rawda:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('rawda:'+k,JSON.stringify(v))}catch(e){}}};
let cur=-1, saveT=null;
const idx=id=>S.findIndex(s=>s.id===id);

// thème & taille
const themes=['system','light','dark'];
function applyTheme(t){if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);}
let theme=store.get('theme','system');applyTheme(theme);
$('btn-th').onclick=()=>{theme=themes[(themes.indexOf(theme)+1)%3];applyTheme(theme);store.set('theme',theme);toast(theme==='system'?'Thème du système':theme==='light'?'Thème clair':'Thème sombre');};
let fs=store.get('fs',matchMedia('(min-width:1080px)').matches?1.2:1.08);
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'rem');}
applyFs();
$('btn-fm').onclick=()=>{fs=Math.max(.9,+(fs-.06).toFixed(2));applyFs();store.set('fs',fs);};
$('btn-fp').onclick=()=>{fs=Math.min(1.5,+(fs+.06).toFixed(2));applyFs();store.set('fs',fs);};

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

// sommaire
function buildToc(){
  let h='<a href="index.html" data-s="cover" class="l1 solo">Couverture</a>';let open=false;
  for(const [l,tt,s,a] of T){
    if(l===1){if(open)h+='</div></div>';h+=`<div class="grp" data-g="${s}"><div class="gh"><button class="car" aria-label="Déplier ou replier" aria-expanded="false">▸</button><a href="${url(s)}" data-s="${s}" class="l1">${esc(tt)}</a></div><div class="kids">`;open=true;}
    else h+=`<a href="${url(s,a)}" data-s="${s}" class="l${l}">${esc(tt)}</a>`;
  }
  if(open)h+='</div></div>';
  $('toclist').innerHTML=h;
}
$('toclist').addEventListener('click',e=>{const c=e.target.closest('.car');if(c){e.preventDefault();e.stopPropagation();const g=c.closest('.grp');g.classList.toggle('open');c.setAttribute('aria-expanded',g.classList.contains('open'));}},true);
function openGroupOf(sid){const a=$('toclist').querySelector(`a[data-s="${sid}"]`);const g=a&&a.closest('.grp');if(g&&!g.classList.contains('open')){g.classList.add('open');g.querySelector('.car').setAttribute('aria-expanded','true');}}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
buildToc();

// tiroir
function openD(tab){$('drawer').classList.add('open');$('shade').hidden=false;showTab(tab||'toc');
  const c=$('toclist').querySelector('a.cur');if(c&&tab!=='bm')c.scrollIntoView({block:'center'});}
function closeD(){if(wide())return;$('drawer').classList.remove('open');$('shade').hidden=true;}
function wide(){return matchMedia('(min-width:1080px)').matches;}
$('btn-toc').onclick=()=>{if(wide()){const h=document.body.classList.toggle('side-off');store.set('sideoff',h);}else openD('toc');};
if(store.get('sideoff',false))document.body.classList.add('side-off');$('btn-close').onclick=closeD;$('shade').onclick=closeD;
function showTab(t){$('toclist').hidden=t!=='toc';$('bmlist').hidden=t!=='bm';$('tab-toc').classList.toggle('on',t==='toc');$('tab-bm').classList.toggle('on',t==='bm');if(t==='bm')renderBm();}
$('tab-toc').onclick=()=>showTab('toc');$('tab-bm').onclick=()=>showTab('bm');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});
$('toclist').addEventListener('click',e=>{if(e.target.closest('a'))closeD();});

// rendu
function cover(){
  if(C!=='cover'){location.href='index.html';return;}
  cur=-1;
  $('page').innerHTML=`<div class="cover">
  <span class="orn" aria-hidden="true"></span>
  <p class="arttl" lang="ar">روضة الأنوار</p>
  <p class="arsub" lang="ar">في سيرة النبي المختار ﷺ</p>
  <h1>Le jardin des lumières</h1>
  <p class="sub">sur la biographie du Prophète élu ﷺ</p>
  <p class="au">Safî ar-Rahmân al-Mubârakfûrî</p>
  <p class="tr">Huitième édition, 1432 H · traduction française intégrale</p>
  <div class="cta"><button id="go-start">Commencer la lecture</button>${resumeBtn()}</div>
  <div class="rule"></div>
  <p style="color:var(--muted);font-size:.92rem;text-align:center">${S.length} chapitres · versets en arabe vocalisé avec leur traduction et leurs références</p>
  </div>
  <section class="ctoc" aria-labelledby="ctoc-h"><h2 id="ctoc-h">Sommaire</h2><ol>${T.filter(x=>x[0]<=1).map(([l,t,s,a])=>`<li class="c${l}"><a href="${url(s,a)}">${esc(t)}</a></li>`).join('')}</ol></section>`;
  $('go-start').onclick=()=>go(S[0].id);
  const r=$('go-resume');if(r)r.onclick=()=>{const p=store.get('pos',null);go(p.s,null,p.y);};
  $('ttl').innerHTML='<b>Le jardin des lumières</b>';
  setNav();markToc('cover');progress();
}
function resumeBtn(){const p=store.get('pos',null);if(!p||idx(p.s)<0)return '';return `<button class="alt" id="go-resume">Reprendre : ${esc(S[idx(p.s)].title.slice(0,48))}</button>`;}
function go(sid,anchor,y){
  const i=idx(sid);if(i<0){cover();return;}
  if(sid!==C){if(typeof y==='number')store.set('jump',{s:sid,y:y});location.href=url(sid,anchor);return;}
  cur=i;const s=S[i];
  $('page').innerHTML=s.html;
  const part=partOf(i);
  $('ttl').innerHTML=(part&&part!==s.title?esc(short(part))+' · ':'')+'<b>'+esc(short(s.title))+'</b>';
  setNav();markToc(sid);
  const want=anchor||sid;
  if(location.hash.slice(1)!==want)history.replaceState(null,'','#'+want);
  requestAnimationFrame(()=>{
    if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView();progress();return;}}
    if(typeof y==='number'){window.scrollTo(0,y*(document.documentElement.scrollHeight-innerHeight));}
    else window.scrollTo(0,0);
    progress();
  });
}
function short(t){return t.length>60?t.slice(0,58)+'…':t;}
function partOf(i){for(let k=i;k>=0;k--)if(S[k].level===1)return S[k].title;return '';}
function setNav(){
  const p=cur-1,n=cur+1;
  $('prev').disabled=cur<0;$('prevt').textContent=p>=0?S[p].title:'Couverture';
  $('next').disabled=n>=S.length;$('nextt').textContent=n<S.length?S[n].title:'';
}
$('prev').onclick=()=>{if(cur<=0)cover();else go(S[cur-1].id);};
$('next').onclick=()=>{if(cur+1<S.length)go(S[cur+1].id);};
function markToc(sid){$('toclist').querySelectorAll('a').forEach(a=>a.classList.toggle('cur',a.dataset.s===sid&&!a.getAttribute('href').includes('-h')));openGroupOf(sid);if(wide()){const c=$('toclist').querySelector('a.cur');if(c){const r=c.getBoundingClientRect(),d=$('toclist').getBoundingClientRect();if(r.top<d.top||r.bottom>d.bottom)c.scrollIntoView({block:'center'});}}}

// progression
function frac(){const h=document.documentElement.scrollHeight-innerHeight;return h>0?Math.min(1,Math.max(0,scrollY/h)):1;}
function progress(){
  const tot=cur<0?0:(cur+frac())/S.length;
  $('progbar').style.width=(tot*100).toFixed(1)+'%';$('pct').textContent=Math.round(tot*100)+' %';
  if(cur>=0){clearTimeout(saveT);saveT=setTimeout(()=>store.set('pos',{s:S[cur].id,y:frac()}),300);}
}
addEventListener('scroll',progress,{passive:true});addEventListener('resize',progress);

// marque-pages
function nearestHeading(){
  const hs=[...$('page').querySelectorAll('h3[id],h4[id],h5[id]')];let best=null;
  for(const h of hs){if(h.getBoundingClientRect().top<140)best=h;}
  return best;
}
$('btn-bm').onclick=()=>{
  if(cur<0){toast('Ouvrez un chapitre pour poser un marque-page');return;}
  const h=nearestHeading();const list=store.get('bm',[]);
  const item={s:S[cur].id,a:h?h.id:null,y:frac(),t:S[cur].title,h:h?h.textContent:'',d:Date.now()};
  list.unshift(item);store.set('bm',list.slice(0,60));updCount();toast('Marque-page ajouté');
};
function updCount(){const n=store.get('bm',[]).length;$('bmcount').textContent=n?'('+n+')':'';}
function renderBm(){
  const list=store.get('bm',[]);
  if(!list.length){$('bmlist').innerHTML='<p class="empty">Aucun marque-page. Pendant la lecture, touchez « 🔖 Marquer » pour enregistrer l\'endroit où vous êtes.</p>';return;}
  $('bmlist').innerHTML=list.map((b,i)=>`<div class="bm"><a href="#" data-i="${i}">${esc(b.h||b.t)}<small>${esc(b.h?b.t:'')} · ${Math.round(b.y*100)} % du chapitre · ${new Date(b.d).toLocaleDateString('fr-FR')}</small></a><button data-del="${i}" aria-label="Supprimer">✕</button></div>`).join('');
}
$('bmlist').addEventListener('click',e=>{
  const a=e.target.closest('a[data-i]'),d=e.target.closest('button[data-del]');const list=store.get('bm',[]);
  if(a){e.preventDefault();const b=list[+a.dataset.i];closeD();go(b.s,null,b.y);}
  if(d){list.splice(+d.dataset.del,1);store.set('bm',list);updCount();renderBm();}
});
updCount();

// routage
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==='couverture'){cover();return;}
  if(!h){if(C==='cover'){cover();return;}const j=store.get('jump',null);if(j&&j.s===C){store.set('jump',null);go(C,null,j.y);}else go(C);return;}
  const sid=h.split('-')[0];
  if(sid.startsWith('n')||sid.startsWith('r')){ // note: rester dans le chapitre
    const el=document.getElementById(h);if(el)el.scrollIntoView({block:'center'});return;}
  if(idx(sid)<0){cover();return;}
  if(sid===C&&cur<0){const j=store.get('jump',null);if(j&&j.s===C){store.set('jump',null);go(C,null,j.y);return;}}
  if(S[cur]&&S[cur].id===sid){const el=document.getElementById(h);if(el&&h!==sid)el.scrollIntoView();else if(h===sid)scrollTo(0,0);return;}
  go(sid,h!==sid?h:null);
}
  /* ---------- fenêtre des notes ---------- */
  (function () {
    let pop = null, anchor = null;
    function close() { if (pop) { pop.remove(); pop = null; } if (anchor) { anchor.setAttribute('aria-expanded', 'false'); anchor = null; } }
    function place() {
      if (!pop || !anchor) return;
      const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, m = 12;
      let left = Math.min(Math.max(m, r.left + r.width / 2 - w / 2), innerWidth - w - m);
      let top = r.bottom + 8, below = true;
      if (top + h > innerHeight - m && r.top - h - 8 > m) { top = r.top - h - 8; below = false; }
      pop.style.left = left + 'px'; pop.style.top = top + 'px';
      pop.classList.toggle('up', !below);
      pop.style.setProperty('--ax', (r.left + r.width / 2 - left) + 'px');
    }
    document.addEventListener('click', function (e) {
      const a = e.target.closest('sup.fn a');
      if (a) {
        e.preventDefault();
        if (anchor === a) { close(); return; }
        close();
        const id = a.getAttribute('href').slice(1), li = document.getElementById(id);
        if (!li) return;
        const c = li.cloneNode(true); c.querySelectorAll('.back').forEach((x) => x.remove());
        pop = document.createElement('div');
        pop.className = 'notepop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Note ' + a.textContent);
        pop.innerHTML = '<div class="np-h"><span>Note ' + a.textContent + '</span><button class="np-x" aria-label="Fermer">✕</button></div><div class="np-b"></div><a class="np-go" href="#' + id + '">Voir dans la liste des notes ↓</a>';
        pop.querySelector('.np-b').innerHTML = c.innerHTML;
        document.body.appendChild(pop);
        anchor = a; a.setAttribute('aria-expanded', 'true');
        place();
        pop.querySelector('.np-x').onclick = close;
        pop.querySelector('.np-go').onclick = function (ev) { ev.preventDefault(); close(); li.scrollIntoView({ block: 'center' }); li.classList.add('flash'); setTimeout(() => li.classList.remove('flash'), 1600); };
        return;
      }
      if (pop && !e.target.closest('.notepop')) close();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    addEventListener('scroll', place, { passive: true });
    addEventListener('resize', place);
  })();

addEventListener('hashchange',route);
route();
})();
